<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Motion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/adc95a3d6316f059dc4ede675a366f7e?family=Owners+XWide" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #222222;
            color: #fff;
            user-select: none;
        }

        /* Vanta.js background */
        #vanta-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* Logo bar */
        .logo-bar {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2rem 1.2rem;
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-pill {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 0.6rem 2.5rem;
            transition: background 0.8s ease, border-color 0.8s ease;
        }

        .logo-text {
            font-family: 'Owners XWide', 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: #fff;
        }

        /* Menu button */
        .menu-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            width: 42px; height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            color: #fff;
            font-size: 1.4rem;
            font-weight: 300;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .menu-btn.open {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Dropdown */
        .nav-dropdown {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 0.5rem 0;
            min-width: 280px;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50%) translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }

        .nav-dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .nav-dropdown a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 1.4rem;
            color: #fff;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            transition: background 0.2s ease;
        }

        .nav-dropdown a:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-dropdown a:first-child {
            border-radius: 16px 16px 0 0;
        }

        .nav-dropdown a:last-child {
            border-radius: 0 0 16px 16px;
        }

        /* Contact form inside dropdown */
        .contact-form-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 0;
        }

        .contact-form-wrapper.open {
            max-height: 500px;
            opacity: 1;
        }

        .contact-form {
            padding: 1rem 1.2rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .contact-form input,
        .contact-form textarea {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .contact-form input::placeholder,
        .contact-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .contact-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .contact-form button {
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            border: none;
            border-radius: 8px;
            padding: 0.85rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .contact-form button:hover {
            background: #fff;
        }

        .nav-dropdown .arrow {
            font-size: 1.1rem;
            opacity: 0.5;
        }

        .nav-dropdown .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 1rem;
        }

        /* Each slide is a full viewport section */
        .slide {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* Video frame */
        .video-frame {
            width: 280px;
            height: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.5),
                0 10px 30px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            cursor: pointer;
            background: #000;
            /* Animate in */
            opacity: 0;
            transform: scale(0.85);
            filter: blur(15px);
            transition: opacity 0.7s ease, transform 0.7s ease, filter 0.7s ease;
        }

        .slide.visible .video-frame {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
        }

        .video-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            transition: transform 0.4s ease;
        }

        .video-frame:hover img {
            transform: scale(1.03);
        }

        /* Play button */
        .play-btn {
            position: absolute;
            bottom: 15%; left: 50%;
            transform: translateX(-50%);
            width: 56px; height: 56px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, background 0.3s ease;
            z-index: 5;
        }

        .play-btn::after {
            content: '';
            display: block;
            width: 0; height: 0;
            border-style: solid;
            border-width: 10px 0 10px 18px;
            border-color: transparent transparent transparent rgba(255, 255, 255, 0.5);
            margin-left: 3px;
        }

        .video-frame:hover .play-btn {
            transform: translateX(-50%) scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }

        /* Video title */
        .slide-title {
            margin-bottom: 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
        }

        .slide.visible .slide-title {
            opacity: 0.6;
            transform: translateY(0);
        }

        .slide-desc {
            margin-bottom: 1rem;
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            max-width: 280px;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.6s ease 0.35s, transform 0.6s ease 0.35s;
        }

        .slide.visible .slide-desc {
            opacity: 0.4;
            transform: translateY(0);
        }

        /* Reflection */
        .video-reflection {
            width: 280px;
            height: 80px;
            margin-top: -2px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.04), transparent);
            border-radius: 0 0 16px 16px;
            filter: blur(8px);
            transform: scaleY(-0.3);
            opacity: 0;
            transition: opacity 0.7s ease 0.1s;
        }

        .slide.visible .video-reflection {
            opacity: 0.5;
        }

        /* YouTube iframe when playing */
        .video-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 16px;
        }

        /* Gallery CTA */
        .gallery-cta {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6rem 2rem 8rem;
            text-align: center;
        }

        .gallery-cta .cta-line {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.3));
            margin-bottom: 2.5rem;
        }

        .gallery-cta .cta-text {
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-size: 1.05rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.02em;
            margin-bottom: 1.8rem;
        }

        .gallery-cta .cta-link {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Owners XWide', 'Inter', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #fff;
            text-decoration: none;
            padding: 0.9rem 2.2rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        .gallery-cta .cta-link:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        .gallery-cta .cta-link .cta-arrow {
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        .gallery-cta .cta-link:hover .cta-arrow {
            transform: translateX(4px);
        }

        /* Mobile */
        @media (max-width: 768px) {
            .slide { padding-top: 4rem; }
            .video-frame {
                width: 260px;
                height: 462px;
            }
            .video-reflection { width: 260px; }
            .logo-text { font-size: 0.9rem; }
            .logo-pill { padding: 0.5rem 1.8rem; }
        }

        @media (max-width: 380px) {
            .video-frame {
                width: 230px;
                height: 409px;
            }
            .video-reflection { width: 230px; }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div id="vanta-bg"></div>

    <!-- Logo + Menu -->
    <div class="logo-bar">
        <div class="nav-container">
            <div class="logo-pill" id="logoPill">
                <span class="logo-text">PURE MOTION</span>
            </div>
            <div class="menu-btn" id="menuBtn">+</div>
        </div>
    </div>

    <!-- Dropdown Menu -->
    <div class="nav-dropdown" id="navDropdown">
        <a href="about.html">ABOUT US <span class="arrow">&rarr;</span></a>
        <div class="divider"></div>
        <a href="gallery.html">GALLERY <span class="arrow">&rarr;</span></a>
        <div class="divider"></div>
        <a href="#" id="contactToggle">CONTACT <span class="arrow" id="contactArrow">&rarr;</span></a>
        <div class="contact-form-wrapper" id="contactForm">
            <div class="divider"></div>
            <form class="contact-form" action="https://formsubmit.co/puremotionmediallc@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="New inquiry from Pure Motion website">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="https://puremotionmedia.co">
                <input type="email" name="email" placeholder="Email*" required>
                <input type="text" name="name" placeholder="Name">
                <textarea name="message" placeholder="Message..."></textarea>
                <button type="submit">SUBMIT</button>
            </form>
        </div>
    </div>

    <!-- Showreel -->
    <section class="slide" data-color="#151515" data-id="j6ZnXl3ypV4"
        data-blob1="#2a2a2a" data-blob2="#1f1f1f" data-blob3="#333333"
        data-blob4="#1a1a1a" data-blob5="#2e2e2e">
        <p class="slide-title">Showreel</p>
        <p class="slide-desc">A showcase of our work — every project filmed, directed, and edited entirely by Pure Motion.</p>
        <div class="video-frame">
            <img src="reel-cover.png" alt="">
            <div class="play-btn"></div>
        </div>
        <div class="video-reflection"></div>
    </section>

    <!-- Gallery CTA -->
    <section class="gallery-cta">
        <div class="cta-line"></div>
        <p class="cta-text">There's more where that came from.</p>
        <a href="gallery.html" class="cta-link">View the Work <span class="cta-arrow">&rarr;</span></a>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
    <script>
        try {
            VANTA.DOTS({
                el: "#vanta-bg",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                color: 0xffffff,
                color2: 0xffffff,
                backgroundColor: 0x222222,
                size: 2.0,
                spacing: 20.00,
                showLines: false
            });
        } catch(e) {
            document.getElementById('vanta-bg').style.background = '#222222';
        }

        const slide = document.querySelector('.slide');
        slide.classList.add('visible');

        // Click to play video
        document.querySelector('.video-frame').addEventListener('click', function () {
            const id = slide.dataset.id;
            this.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        });

        // Menu toggle
        const menuBtn = document.getElementById('menuBtn');
        const navDropdown = document.getElementById('navDropdown');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = navDropdown.classList.toggle('open');
            menuBtn.classList.toggle('open');
            menuBtn.textContent = isOpen ? '\u00d7' : '+';
        });

        // Contact form toggle
        const contactToggle = document.getElementById('contactToggle');
        const contactForm = document.getElementById('contactForm');
        const contactArrow = document.getElementById('contactArrow');

        contactToggle.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const isOpen = contactForm.classList.toggle('open');
            contactArrow.innerHTML = isOpen ? '&darr;' : '&rarr;';
        });

        contactForm.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        function closeMenu() {
            navDropdown.classList.remove('open');
            menuBtn.classList.remove('open');
            menuBtn.textContent = '+';
            contactForm.classList.remove('open');
            contactArrow.innerHTML = '&rarr;';
        }

        document.addEventListener('click', (e) => {
            if (!navDropdown.contains(e.target) && !menuBtn.contains(e.target)) {
                closeMenu();
            }
        });

        // Blur video on scroll
        const videoFrame = document.querySelector('.video-frame');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const blur = Math.min(scrollY / 40, 15);
            const opacity = Math.max(1 - scrollY / 600, 0);
            videoFrame.style.filter = `blur(${blur}px)`;
            videoFrame.style.opacity = opacity;
        });
    </script>

</body>
</html>
