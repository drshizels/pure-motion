    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
    <script>
        try {
            VANTA.DOTS({
                el: "#vanta-bg",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                color: 0xffffff,
                color2: 0xffffff,
                backgroundColor: 0x222222,
                size: 2.0,
                spacing: 20.00,
                showLines: false
            });
        } catch(e) {
            document.getElementById('vanta-bg').style.background = '#222222';
        }
    </script>
