<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Motion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/adc95a3d6316f059dc4ede675a366f7e?family=Owners+XWide" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #111;
            color: #fff;
            user-select: none;
        }

        /* Background layer */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            transition: background-color 0.8s ease;
        }

        /* Noise texture on top of everything */
        .bg-noise {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* Color blobs */
        .bg-blobs {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0;
            transition: opacity 1s ease, background-color 1s ease, transform 1s ease;
        }

        .blob-1 {
            width: 60vw; height: 60vw;
            top: -15%; left: -10%;
        }

        .blob-2 {
            width: 50vw; height: 50vw;
            bottom: -20%; right: -15%;
        }

        .blob-3 {
            width: 40vw; height: 40vw;
            top: 30%; left: 50%;
            transform: translateX(-50%);
        }

        .blob-4 {
            width: 35vw; height: 35vw;
            top: 10%; right: -5%;
        }

        .blob-5 {
            width: 45vw; height: 45vw;
            bottom: 5%; left: 10%;
        }

        /* Logo bar */
        .logo-bar {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2rem 1.2rem;
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-pill {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 0.6rem 2.5rem;
            transition: background 0.8s ease, border-color 0.8s ease;
        }

        .logo-text {
            font-family: 'Owners XWide', 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: #fff;
        }

        /* Menu button */
        .menu-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            width: 42px; height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            color: #fff;
            font-size: 1.4rem;
            font-weight: 300;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .menu-btn.open {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Dropdown */
        .nav-dropdown {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 0.5rem 0;
            min-width: 280px;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50%) translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }

        .nav-dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .nav-dropdown a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 1.4rem;
            color: #fff;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            transition: background 0.2s ease;
        }

        .nav-dropdown a:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-dropdown a:first-child {
            border-radius: 16px 16px 0 0;
        }

        .nav-dropdown a:last-child {
            border-radius: 0 0 16px 16px;
        }

        /* Contact form inside dropdown */
        .contact-form-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 0;
        }

        .contact-form-wrapper.open {
            max-height: 500px;
            opacity: 1;
        }

        .contact-form {
            padding: 1rem 1.2rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .contact-form input,
        .contact-form textarea {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .contact-form input::placeholder,
        .contact-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .contact-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .contact-form button {
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            border: none;
            border-radius: 8px;
            padding: 0.85rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .contact-form button:hover {
            background: #fff;
        }

        .nav-dropdown .arrow {
            font-size: 1.1rem;
            opacity: 0.5;
        }

        .nav-dropdown .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 1rem;
        }

        /* Each slide is a full viewport section */
        .slide {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* Video frame */
        .video-frame {
            width: 280px;
            height: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.5),
                0 10px 30px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            cursor: pointer;
            background: #000;
            /* Animate in */
            opacity: 0;
            transform: scale(0.85);
            filter: blur(15px);
            transition: opacity 0.7s ease, transform 0.7s ease, filter 0.7s ease;
        }

        .slide.visible .video-frame {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
        }

        .video-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .video-frame:hover img {
            transform: scale(1.03);
        }

        /* Play button */
        .play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 56px; height: 56px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, background 0.3s ease;
            z-index: 5;
        }

        .play-btn::after {
            content: '';
            display: block;
            width: 0; height: 0;
            border-style: solid;
            border-width: 10px 0 10px 18px;
            border-color: transparent transparent transparent #222;
            margin-left: 3px;
        }

        .video-frame:hover .play-btn {
            transform: translate(-50%, -50%) scale(1.1);
            background: #fff;
        }

        /* Video title */
        .slide-title {
            margin-bottom: 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
        }

        .slide.visible .slide-title {
            opacity: 0.6;
            transform: translateY(0);
        }

        .slide-desc {
            margin-bottom: 1rem;
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            max-width: 280px;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.6s ease 0.35s, transform 0.6s ease 0.35s;
        }

        .slide.visible .slide-desc {
            opacity: 0.4;
            transform: translateY(0);
        }

        /* Reflection */
        .video-reflection {
            width: 280px;
            height: 80px;
            margin-top: -2px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.04), transparent);
            border-radius: 0 0 16px 16px;
            filter: blur(8px);
            transform: scaleY(-0.3);
            opacity: 0;
            transition: opacity 0.7s ease 0.1s;
        }

        .slide.visible .video-reflection {
            opacity: 0.5;
        }

        /* YouTube iframe when playing */
        .video-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 16px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .video-frame {
                width: 260px;
                height: 462px;
            }
            .video-reflection { width: 260px; }
            .logo-text { font-size: 0.9rem; }
            .logo-pill { padding: 0.5rem 1.8rem; }
        }

        @media (max-width: 380px) {
            .video-frame {
                width: 230px;
                height: 409px;
            }
            .video-reflection { width: 230px; }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-layer" id="bgLayer"></div>
    <div class="bg-blobs" id="bgBlobs">
        <div class="blob blob-1" id="blob1"></div>
        <div class="blob blob-2" id="blob2"></div>
        <div class="blob blob-3" id="blob3"></div>
        <div class="blob blob-4" id="blob4"></div>
        <div class="blob blob-5" id="blob5"></div>
    </div>
    <div class="bg-noise"></div>

    <!-- Logo + Menu -->
    <div class="logo-bar">
        <div class="nav-container">
            <div class="logo-pill" id="logoPill">
                <span class="logo-text">PURE MOTION</span>
            </div>
            <div class="menu-btn" id="menuBtn">+</div>
        </div>
    </div>

    <!-- Dropdown Menu -->
    <div class="nav-dropdown" id="navDropdown">
        <a href="#about">ABOUT US <span class="arrow">&rarr;</span></a>
        <div class="divider"></div>
        <a href="gallery.html">GALLERY <span class="arrow">&rarr;</span></a>
        <div class="divider"></div>
        <a href="#" id="contactToggle">CONTACT <span class="arrow" id="contactArrow">&rarr;</span></a>
        <div class="contact-form-wrapper" id="contactForm">
            <div class="divider"></div>
            <form class="contact-form" action="https://formsubmit.co/puremotionmediallc@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="New inquiry from Pure Motion website">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="https://puremotionmedia.co">
                <input type="email" name="email" placeholder="Email*" required>
                <input type="text" name="name" placeholder="Name">
                <textarea name="message" placeholder="Message..."></textarea>
                <button type="submit">SUBMIT</button>
            </form>
        </div>
    </div>

    <!-- Showreel -->
    <section class="slide" data-color="#151515" data-id="j6ZnXl3ypV4"
        data-blob1="#2a2a2a" data-blob2="#1f1f1f" data-blob3="#333333"
        data-blob4="#1a1a1a" data-blob5="#2e2e2e">
        <p class="slide-title">Showreel</p>
        <p class="slide-desc">A showcase of our work — every project filmed, directed, and edited entirely by Pure Motion.</p>
        <div class="video-frame">
            <img src="https://img.youtube.com/vi/j6ZnXl3ypV4/maxresdefault.jpg" alt="">
            <div class="play-btn"></div>
        </div>
        <div class="video-reflection"></div>
    </section>

    <script>
        const slide = document.querySelector('.slide');
        const bgLayer = document.getElementById('bgLayer');
        const logoPill = document.getElementById('logoPill');

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        const blobs = [
            document.getElementById('blob1'),
            document.getElementById('blob2'),
            document.getElementById('blob3'),
            document.getElementById('blob4'),
            document.getElementById('blob5')
        ];

        const blobConfigs = [
            { opacity: 0.35, scale: 1.0 },
            { opacity: 0.25, scale: 1.1 },
            { opacity: 0.2,  scale: 0.9 },
            { opacity: 0.15, scale: 1.05 },
            { opacity: 0.3,  scale: 0.95 }
        ];

        // Set background and blobs
        bgLayer.style.backgroundColor = slide.dataset.color;
        blobs.forEach((blob, i) => {
            const color = slide.dataset[`blob${i + 1}`];
            if (color) {
                blob.style.backgroundColor = color;
                blob.style.opacity = blobConfigs[i].opacity;
                blob.style.transform = `scale(${blobConfigs[i].scale})`;
            }
        });
        const blobColor = slide.dataset.blob1 || slide.dataset.color;
        logoPill.style.background = `rgba(${hexToRgb(blobColor)}, 0.35)`;
        slide.classList.add('visible');

        // Click to play video
        document.querySelector('.video-frame').addEventListener('click', function () {
            const id = slide.dataset.id;
            this.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        });

        // Menu toggle
        const menuBtn = document.getElementById('menuBtn');
        const navDropdown = document.getElementById('navDropdown');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = navDropdown.classList.toggle('open');
            menuBtn.classList.toggle('open');
            menuBtn.textContent = isOpen ? '\u00d7' : '+';
        });

        // Contact form toggle
        const contactToggle = document.getElementById('contactToggle');
        const contactForm = document.getElementById('contactForm');
        const contactArrow = document.getElementById('contactArrow');

        contactToggle.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const isOpen = contactForm.classList.toggle('open');
            contactArrow.innerHTML = isOpen ? '&darr;' : '&rarr;';
        });

        contactForm.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        function closeMenu() {
            navDropdown.classList.remove('open');
            menuBtn.classList.remove('open');
            menuBtn.textContent = '+';
            contactForm.classList.remove('open');
            contactArrow.innerHTML = '&rarr;';
        }

        document.addEventListener('click', (e) => {
            if (!navDropdown.contains(e.target) && !menuBtn.contains(e.target)) {
                closeMenu();
            }
        });
    </script>

</body>
</html>
